<style>
  @font-face {
    font-family: 'NexonMaplestory';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFLight.woff') format('woff');
    font-weight: 300;
    font-display: swap;
  }

  @font-face {
    font-family: 'NexonMaplestory';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --bg: #f4f5f2;
    --surface: #ffffff;
    --text: #161f1c;
    --muted: #5c6864;
    --accent: #0d7d6f;
    --accent-soft: #e4efec;
    --border: #dee3e0;
    --font-display: 'NexonMaplestory', serif;
    --font-body: 'NexonMaplestory', sans-serif;
    --font-mono: 'NexonMaplestory', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1614;
      --surface: #17211e;
      --text: #eef2f0;
      --muted: #8fa39c;
      --accent: #57d9bf;
      --accent-soft: #1b2b27;
      --border: #25322e;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0f1614;
    --surface: #17211e;
    --text: #eef2f0;
    --muted: #8fa39c;
    --accent: #57d9bf;
    --accent-soft: #1b2b27;
    --border: #25322e;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
  }

  h1, h2, .font-display { font-family: var(--font-display); }
  .font-mono { font-family: var(--font-mono); }

  h1 { text-wrap: balance; }

  a.post-title { transition: color 0.15s ease; }
  a.post-title:hover, a.post-title:focus-visible { color: var(--accent); }

  a.intro-link { transition: opacity 0.15s ease; }
  a.intro-link:hover, a.intro-link:focus-visible { opacity: 0.7; }

  a:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body class="leading-relaxed">

<div class="max-w-5xl mx-auto px-6">

  <header class="flex justify-between items-center py-7 border-b" style="border-color: var(--border)">
    <div class="font-display text-xl tracking-tight">만둥만덩's VLOG</div>
    <nav class="flex gap-8 text-sm" style="color: var(--muted)">
      <a href="#" class="intro-link">Home</a>
      <a href="#" class="intro-link">About</a>
      <a href="#" class="intro-link">Contact</a>
    </nav>
  </header>

  <section class="grid md:grid-cols-[1.3fr_1fr] gap-10 md:gap-16 py-20 items-end">
    <div>
      <p class="text-xs uppercase tracking-[0.2em] mb-4" style="color: var(--accent)">Personal Blog</p>
      <h1 class="font-display text-4xl md:text-5xl leading-[1.15]">생각을 기록하는<br>조용한 공간</h1>
    </div>
    <div class="space-y-5">
      <p class="text-base" style="color: var(--muted)">
        일상, 개발, 그리고 배운 것들을 편하게 적어두는 블로그입니다.
        거창하지 않게, 남겨두고 싶은 순간들을 씁니다.
      </p>
      <a href="#posts" class="intro-link inline-flex items-center gap-2 text-sm font-medium underline underline-offset-4" style="color: var(--accent); text-decoration-color: var(--accent)">
        최신 글 보기 <span aria-hidden="true">→</span>
      </a>
    </div>
  </section>

  <section id="posts" class="border-t pt-4 pb-24" style="border-color: var(--border)">
    <article class="grid grid-cols-[88px_1fr] md:grid-cols-[120px_1fr_1fr] gap-4 md:gap-8 py-7 border-b items-baseline" style="border-color: var(--border)">
      <div class="font-mono text-sm tabular-nums" style="color: var(--muted)">2026.08.14</div>
      <a href="#" class="post-title font-display text-xl md:col-span-1">첫 번째 글</a>
      <p class="text-sm hidden md:block" style="color: var(--muted)">블로그를 시작하며 남기는 첫 인사입니다.</p>
    </article>
    <article class="grid grid-cols-[88px_1fr] md:grid-cols-[120px_1fr_1fr] gap-4 md:gap-8 py-7 border-b items-baseline" style="border-color: var(--border)">
      <div class="font-mono text-sm tabular-nums" style="color: var(--muted)">2026.08.10</div>
      <a href="#" class="post-title font-display text-xl md:col-span-1">두 번째 글</a>
      <p class="text-sm hidden md:block" style="color: var(--muted)">요즘 관심있게 보고 있는 주제에 대한 이야기.</p>
    </article>
    <article class="grid grid-cols-[88px_1fr] md:grid-cols-[120px_1fr_1fr] gap-4 md:gap-8 py-7 border-b items-baseline" style="border-color: var(--border)">
      <div class="font-mono text-sm tabular-nums" style="color: var(--muted)">2026.08.05</div>
      <a href="#" class="post-title font-display text-xl md:col-span-1">세 번째 글</a>
      <p class="text-sm hidden md:block" style="color: var(--muted)">간단한 팁과 정리 노트.</p>
    </article>
  </section>

  <footer class="flex justify-between items-center py-8 border-t text-xs uppercase tracking-wide" style="border-color: var(--border); color: var(--muted)">
    <span>© 2026 만둥만덩's VLOG</span>
    <span>Built with care</span>
  </footer>

</div>

</body>
</html>
