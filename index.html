document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: v 0); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 999px; }\n.input { padding-inline: 14px; }\n\n<\u002Fstyle>\n<script src=\"caa3754d-0480-4252-80ee-056a8dbee9e1\"><\u002Fscript>\n<script src=\"61056e46-2c60-44d4-a865-c4182852e725\"><\u002Fscript>\n\n\n<script>(function(){setInterval(function(){var f=document.getElementById('cwMap');var r=window.__resources&&window.__resources.mapPage;if(f&&r&&f.getAttribute('data-swapped')!=='1'){f.setAttribute('data-swapped','1');f.src=r;}},400);})();<\u002Fscript>\n<style>\n  @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');\n  body {\n    margin: 0; min-height: 100vh; color: var(--color-text); font-family: 'Galmuri11', monospace;\n    background-image: url('/images/couple-world-bg.png'); background-color: #4fb0e8; background-repeat: no-repeat; background-position: center bottom; background-size: cover; background-attachment: fixed;\n  }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent-600); }\n  input, textarea, button { font-family: inherit; }\n  :focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n  ::-webkit-scrollbar { width: 10px; height: 10px; }\n  ::-webkit-scrollbar-thumb { background: var(--color-accent-400); border-radius: 999px; }\n<\u002Fstyle>\n<style>\n/* ── Pixel-RPG reskin — palette + component retouch, layered on top of the\n   existing design-system tokens. Nothing below adds, removes, or renames\n   any element; every rule either redefines an existing --color-*/--radius-*\n   token (so it cascades through every var() already in the markup) or\n   targets one specific, already-unique inline-style fragment with an\n   attribute selector, so no class/id/structure changes anywhere. ── */\n:root {\n  --color-bg: #eaf6ff !important;\n  --color-surface: #fff8e7 !important;\n  --color-text: #23406b !important;\n\n  --color-neutral-100:\n    repeating-linear-gradient(0deg, rgba(120,90,40,.05) 0px, rgba(120,90,40,.05) 1px, transparent 1p ter\">자르기 수정<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ clearFormPhoto }}\" style=\"border:2px solid var(--color-accent-800);background:var(--color-neutral-100);color:var(--color-accent-800);border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer\">제거<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--color-neutral-700)\">\n                <span>지역 검색 · 월드맵에 표시할 시·군을 먼저 선택하세요<\u002Fspan>\n                <input value=\"{{ region.q }}\" sc-camel-on-change=\"{{ onRegionQ }}\" placeholder=\"예: 대전, 강릉, 전주\" style=\"border:3px solid var(--color-accent-800);border-radius:999px;padding:9px 14px;font-size:13px;background:var(--color-neutral-100);color:var(--color-text)\">\n                <sc-if value=\"{{ region.showList }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                    <sc-for list=\"{{ region.results }}\" as=\"r\" hint-placeholder-count=\"4\">\n                      <button sc-camel-on-click=\"{{ r.pick }}\" style=\"border:2px solid var(--color-accent-800);background:{{ r.bg }};color:{{ r.fg }};border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer\">{{ r.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ region.picked }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:12px;color:var(--color-accent-2-800);background:var(--color-accent-2-200);border-radius:999px;padding:6px 14px;align-self:flex-start\">월드맵 등록 · {{ region.pickedName }} ({{ region.pickedGroup }})<\u002Fspan>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ region.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font-size:12px;color:var(--color-neutral-600)\">일치하는 시·군이 없습니다<\u00 #$%^&*()_+-=[]{}|;:,.<>?/~`';\nconst validPassword = pw => {\n  const s = String(pw || '');\n  if (s.length < 8 || s.length > 16) return false;\n  let specials = 0;\n  for (const ch of s) {\n    if (/[A-Za-z0-9]/.test(ch)) continue;\n    if (PW_SPECIALS.indexOf(ch) === -1) return false;\n    specials++;\n  }\n  return specials >= 2;\n};\nconst isoToDots = v => String(v || '').split('-').join('.');\nconst dotsToIso = v => String(v || '').split('.').join('-');\n\nconst QUESTS = [\n  { id: 'login', name: '커플월드 계정 만들고 로그인하기', reward: 30, hint: '우측 상단 회원가입 또는 로그인' },\n  { id: 'profile', name: '내 캐릭터 프로필 바꾸기', reward: 50, hint: '왼쪽 내 캐릭터를 클릭해 닉네임·상태 메시지 변경' },\n  { id: 'record', name: '추억 1건 기록하기', reward: 50, hint: '기록 탭에서 사진·날짜·일기 저장' },\n  { id: 'region', name: '기록에 지역 등록하기', reward: 80, hint: '기록 탭 지역 검색에서 시·군 선택 후 저장' },\n  { id: 'map3', name: '월드맵에서 장소 기록 3곳 열어보기', reward: 60, hint: '월드맵 → 지역 → 시 순서로 들어가기' },\n  { id: 'shop', name: '상점에서 아이템 1개 구매하기', reward: 40, hint: '포인트 상점에서 구매' }\n];\n\nclass Component extends DCLogic {\n  state = {\n    a: 'home', sel: 0, points: 0,\n    user: null, start: '2023.05.19',\n    auth: {\n      open: false, mode: 'login', name: '', password: '', password2: '', nickname: '', gender: '', birth: '', remember: false,\n      idCheck: null, idMsg: '', nickCheck: null, nickMsg: '', msg: '', ok: false,\n      foundPassword: null, newPassword: '', newPassword2: ''\n    },\n    couple: { open: false, partner: '', start: '', msg: '', ok: false, sent: false }, coupleLinked: false,\n    crop: { open: false, target: null, ratio: 'free' }, profileMsg: '',\n    mailOpen: false, mailboxItems: [],\n    inquiryOpen: false, inquiryForm: { title: '', body: '', photo: null }, inquiryMsg: '', inquiryOk: false, myInquiries: [],\n    msgOpen: false, msgs: [], msgDraft: '', confirm: null,\n    me: { name: '김민정', msg: '오늘도 잘 지냈어', title: '만둥섬 주민' },\n    partner: { name: '만둥만덩', msg: '다음 데이트 언제야?', title: '집사' },\n    profileOpen: false,\n    prof: { name: '', msg: '', title: '', avatar: null },\n    qdone: {}, openedUnits: [],\n    owned: ['커플 후드', '체크 셔츠'],\n    memories: [\n      { id: 1, date: '2026.08.09', place: '망원동', title: '야시장 산책', text: '더워서 계속 아이스크림만 먹었다. 만둥이 사진 찍어준다고 다섯 번 다시 찍었는데 결국 처음 찍은 게 제일 잘 나왔다.' },\n      { id: 2, date: '2026.07.26', place: '강릉', title: '2박 3일 바다', text: '새벽에 일어나서 해 뜨는 거 보러 갔다. 둘 다 반쯤 자면서 봤지만 그래도 봤다는 게 중요하다.' },\n      { id: 3, date: '2026.07.12', place: '을지로', title: '노포 탐험', text: '골목 세 번 잘못 들어가서 결국 첫 번째 가게로 돌아왔다.' },\n      { id: 4, date: '2026.06.28', place: '집', title: '같이 만든 카레', text: '레시피 두 배로 잘못 계산해서 3일 동안 카레만 먹었다.' },\n      { id: 5, date: '2026.06.14', place: '성수', title: '팝업 구경', text: '줄이 너무 길어서 결국 옆 가게 빵만 사서 나왔다.' },\n      { id: 6, date: '2026.05.19', place: '남산', title: '1096일 기념', text: '3주년. 케이크 초 세 개 꽂고 사진 찍었다.' },\n      { id: 7, date: '2026.05.02', place: '연남동', title: '벼룩시장', text: '만둥이 고른 컵이 집에서 제일 잘 쓰는 컵이 되었다.' },\n      { id: 8, date: '2026.04.18', place: '한강', title: '첫 피크닉', text: '돗자리 두고 나와서 결국 종이가방 깔고 앉았다.' }\n    ],\n    form: { date: '', place: '', text: '', photo: null }\n  };\n\n  async apiPost(path, body) {\n    try {\n      const res = await fetch('/api' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });\n      return await res.json();\n    } catch (e) {\n      return { ok: false, msg: '[시스템] 서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.' };\n    }\n  }\n  saveSession(id, token, remember) {\n    try {\n      const store = remember ? localStorage : sessionStorage;\n      store.setItem('cw-id', id); store.setItem('cw-token', token);\n    } catch (e) {}\n  }\n  clearSession() {\n    try {\n      localStorage.removeItem('cw-id'); localStorage.removeItem('cw-token');\n      sessionStorage.removeItem('cw-id'); sessionStorage.removeItem('cw-token');\n    } catch (e) {}\n  }\n  startDate() { return parseDate(this.state.start) || new Date(2023, 4, 19); }\n\n  days() { return Math.max(1, Math.floor((TODAY - this.startDate()) / DAY) + 1); }\n  ddayOf(s) {\n    const d = parseDate(s);\n    return d ? Math.floor((d - this.startDate()) / DAY) + 1 : 0;\n  }\n  go(v) { return () => this.setState({ a: v }); }\n\n  componentDidMount() {\n    addEventListener('message', e => {\n      if (e.data && e.data.type === 'cw-list' && Array.isArray(e.data.list) && e.data.list.length) {\n        this.setState({ places: e.data.list });\n      }\n    });\n    const ask = setInterval(() => {\n      if ((this.state.places || []).length) { clearInterval(ask); return; }\n      const f = document.getElementById('cwMap');\n      if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'cw-list-request' }, '*');\n    }, 900);\n    // 새로 쓰기 시작 — 데모 데이터 미사용\n    this.setState({ memories: [], points: 0, owned: [], qdone: {}, openedUnits: [], msgs: [] });\n    try {\n      if (localStorage.getItem('cw-reset-v5') !== '1') {\n        localStorage.removeItem('cw-visits');\n        localStorage.removeItem('cw-accounts');\n        localStorage.removeItem('cw-msgs');\n        localStorage.setItem('cw-reset-v5', '1');\n      }\n    } catch (e) {}\n    addEventListener('message', e => {\n      if (!e.data) return;\n      if (e.data.type === 'cw-open-unit' && e.data.unit) {\n        this.setState(s => {\n          const u = s.openedUnits.includes(e.data.unit) ? s.openedUnits : s.openedUnits.concat(e.data.unit);\n          return { openedUnits: u };\n        }, () => { if (this.state.openedUnits.length >= 3) this.complete('map3'); });\n      }\n    });\n    const base = 'https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2013/json/';\n    const groups = [\n      ['서울', ['서울']], ['경기도', ['경기']], ['강원도', ['강원']], ['충청북도', ['충청북']], ['충청남도', ['충청남']],\n      ['전라북도', ['전라북']], ['전라남도', ['전라남']], ['경상북도', ['경상북']], ['경상남도', ['경상남']],\n      ['부산', ['부산']], ['대구', ['대구']], ['인천', ['인천']], ['광주', ['광주']], ['대전', ['대전']], ['울산', ['울산']],\n      ['세종', ['세종']], ['제주도', ['제주']]\n    ];\n    Promise.all([\n      fetch(base + 'skorea_provinces_geo_simple.json').then(r => r.json()),\n      fetch(base + 'skorea_municipalities_geo_simple.json').then(r => r.json())\n    ]).then(([prov, muni]) => {\n      const byCode = {};\n      prov.features.forEach(f => { byCode[f.properties.code.slice(0, 2)] = f.properties.name; });\n      const seen = {};\n      const list = [];\n      muni.features.forEach(f => {\n        const p = byCode[f.properties.code.slice(0, 2)] || '';\n        const metro = /광역시|특별시|특별자치시/.test(p);\n        const m = f.properties.name.match(/^(.+시)[가-힣]+구$/);\n        const unit = metro ? (p.replace(/특별자치시|특별시|광역시/, '') + ' ' + f.properties.name) : (m ? m[1] : f.properties.name);\n        if (seen[unit]) return;\n        seen[unit] = 1;\n        const g = groups.find(([, ms]) => ms.some(x => p.startsWith(x)));\n        list.push({ unit, group: g ? g[0] : '기타' });\n      });\n      this.setState({ places: list });\n    }).catch(() => {});\n\n    let savedId, savedToken;\n    try {\n      savedId = sessionStorage.getItem('cw-id') || localStorage.getItem('cw-id');\n      savedToken = sessionStorage.getItem('cw-token') || localStorage.getItem('cw-token');\n    } catch (e) {}\n    if (savedId && savedToken) {\n      this.apiPost('/session', { id: savedId, token: savedToken }).then(r => {\n        if (!r.ok) { this.clearSession(); return; }\n        this.setState(s => ({\n          user: { id: r.user.id, token: savedToken }, me: { ...s.me, name: r.user.nickname, avatar: r.user.avatar || null }, points: r.user.points || 0,\n          partner: { ...s.partner, name: r.user.partnerNickname || s.partner.name, avatar: r.user.partnerAvatar || null },\n          start: r.user.startDate || s.start, coupleLinked: !!r.user.linked\n        }));\n        this.fetchMailbox(); this.fetchMemories(); this.fetchMessages(); this.fetchNotices();\n        this.fetchQuestStatus(); this.fetchOwnedItems(); this.fetchRegions();\n      });\n    }\n  }\n\n  saveVisit(unit, place, date, text) {\n    try {\n      const key = 'cw-visits';\n      const cur = JSON.parse(localStorage.getItem(key) || '{}');\n      const prev = cur[unit] || {};\n      cur[unit] = {\n        add: (prev.add || 0) + 1,\n        last: date,\n        title: text ? text.slice(0, 14) : (place || unit),\n        text: text || (place + '에서 보낸 하루.')\n      };\n      localStorage.setItem(key, JSON.stringify(cur));\n      const f = document.querySelector('iframe[title=\"월드맵\"]');\n      if (f && f.contentWindow) f.contentWindow.postMessage({ type: 'cw-visit' }, '*');\n    } catch (e) {}\n    const id = this.state.user && this.state.user.id;\n    const token = this.state.user && this.state.user.token;\n    if (id && token) this.apiPost('/region-visit', { id, token, unit, date, title: text ? text.slice(0, 14) : (place || unit), text: text || (place + '에서 보낸 하루.') });\n  }\n\n  async submitForm() {\n    const f = this.state.form;\n    const picked = this.state.picked;\n    if (!f.date && !f.place && !f.text && !picked && !f.photo) { this.setState({ a: 'inven' }); return; }\n    const date = f.date || '2026.08.14';\n    if (picked) this.saveVisit(picked, f.place || picked, date, f.text);\n    const place = f.place || picked || '어딘가';\n    const title = f.text ? f.text.slice(0, 12) : '새 추억';\n    const uid = this.state.user && this.state.user.id;\n    const token = this.state.user && this.state.user.token;\n    const r = await this.apiPost('/memory-add', { id: uid, token, date, place, title, body: f.text || '', photo: f.photo || null });\n    if (!r.ok) return;\n    const m = { id: r.item.id, date: r.item.date, place: r.item.place, region: picked || '', title: r.item.title, text: r.item.body || '', photo: r.item.photo || null };\n    this.setState(s => ({\n      memories: [m].concat(s.memories), points: r.points,\n      form: { date: '', place: '', text: '', photo: null }, q: '', picked: null, a: 'inven', sel: 0\n    }), () => { this.complete('record'); if (picked) this.complete('region'); });\n  }\n\n  regionVals() {\n    const list = this.state.places || [];\n    const q = (this.state.q || '').trim();\n    const results = q ? list.filter(x => x.unit.indexOf(q) === 0 || x.unit.indexOf(q) > -1).slice(0, 8) : [];\n    const picked = this.state.picked;\n    return {\n      q, picked: !!picked, pickedName: picked || '',\n      pickedGroup: picked ? ((list.find(x => x.unit === picked) || {}).group || '') : '',\n      showList: results.length > 0,\n      empty: !!q && list.length > 0 && results.length === 0,\n      results: results.map(r => ({\n        label: r.unit + ' · ' + r.group,\n        bg: picked === r.unit ? 'var(--color-accent-700)' : 'var(--color-neutral-100)',\n        fg: picked === r.unit ? 'var(--color-accent-100)' : 'var(--color-accent-800)',\n        pick: () => this.setState({ picked: r.unit, q: r.unit })\n      }))\n    };\n  }\n\n  mkTabs() {\n    const defs = [['home', '홈'], ['inven', '추억함'], ['write', '기록'], ['quest', '퀘스트'], ['map', '월드맵'], ['shop', '상점']];\n    const cur = this.state.a;\n    const locked = !this.state.coupleLinked;\n    return defs.map(([id, label]) => {\n      const on = cur === id || (id === 'inven' && cur === 'detail');\n      const isLockedTab = locked && (id === 'quest' || id === 'map');\n      const nudge = () => this.setState(s => ({ couple: { ...s.couple, open: true, msg: '', ok: false, sent: false } }));\n      return {\n        id, label: isLockedTab ? '🔒 ' + label : label,\n        go: isLockedTab ? nudge : this.go(id),\n        bg: on ? 'var(--color-accent-700)' : (isLockedTab ? 'var(--color-neutral-300)' : 'var(--color-neutral-100)'),\n        fg: on ? 'var(--color-accent-100)' : (isLockedTab ? 'var(--color-neutral-600)' : 'var(--color-accent-800)')\n      };\n    });\n  }\n  mkQuests() {\n    return QUESTS.map(q => {\n      const done = !!this.state.qdone[q.id];\n      return {\n        ...q,\n        bg: done ? 'var(--color-accent-2-200)' : 'var(--color-neutral-100)',\n        box: done ? 'var(--color-accent-2-600)' : 'var(--color-neutral-200)',\n        mark: done ? '✓' : '',\n        deco: done ? 'line-through' : 'none',\n        status: done ? '획득 +' + q.reward + ' P' : '+' + q.reward + ' P',\n        pill: done ? 'var(--color-accent-2-600)' : 'var(--color-accent-700)'\n      };\n    });\n  }\n\n  complete(id) {\n    if (!this.state.coupleLinked) return;\n    if (this.state.qdone[id]) return;\n    const q = QUESTS.find(x => x.id === id);\n    if (!q) return;\n    this.setState(s => ({ qdone: { ...s.qdone, [id]: 1 } }));\n    const uid = this.state.user && this.state.user.id;\n    const token = this.state.user && this.state.user.token;\n    if (!uid || !token) return;\n    this.apiPost('/points-earn', { id: uid, token, questId: id }).then(r => {\n      if (r.ok) this.setState({ points: r.points });\n    });\n  }\n\n  openAuth(mode) {\n    return () => this.setState(s => ({\n      auth: {\n        ...s.auth, open: true, mode, msg: '', ok: false, idCheck: null, idMsg: '', nickCheck: null, nickMsg: '',\n        foundPassword: null, newPassword: '', newPassword2: ''\n      }\n    }));\n  }\n  async checkId() {\n    const id = (this.state.auth.name || '').trim();\n    if (!id) return this.setState(s => ({ auth: { ...s.auth, idMsg: '[시스템] 아이디를 입력하세요.', idCheck: null } }));\n    const r = await this.apiPost('/check-id', { id });\n    this.setState(s => ({ auth: { ...s.auth, idMsg: r.msg, idCheck: !!r.available } }));\n  }\n  async checkNickname() {\n    const nick = (this.state.auth.nickname || '').trim();\n    if (!nick) return this.setState(s => ({ auth: { ...s.auth, nickMsg: '[시스템] 닉네임을 입력하세요.', nickCheck: null } }));\n    const r = await this.apiPost('/check-nickname', { nickname: nick });\n    this.setState(s => ({ auth: { ...s.auth, nickMsg: r.msg, nickCheck: !!r.available } }));\n  }\n  async doAuth() {\n    const a = this.state.auth;\n    const fail = m => this.setState(s => ({ auth: { ...s.auth, msg: m, ok: false } }));\n\n    if (a.mode === 'signup') {\n      if (!validPassword(a.password)) return fail('[시스템] 비밀번호는 8~16자이며 특수문자를 2개 이상 포함해야 합니다.');\n      if ((a.password2 || '').trim() !== (a.password || '').trim()) return fail('[시스템] 비밀번호 확인이 일치하지 않습니다.');\n      const r = await this.apiPost('/signup', {\n        id: (a.name || '').trim(), password: a.password, nickname: (a.nickname || '').trim(), gender: a.gender, birth: (a.birth || '').trim()\n      });\n      if (!r.ok) return fail(r.msg);\n      this.saveSession(r.user.id, r.token, a.remember);\n      return this.setState(s => ({\n        user: { id: r.user.id, token: r.token }, me: { ...s.me, name: r.user.nickname }, coupleLinked: false,\n        auth: {\n          ...s.auth, open: false, msg: '', password: '', password2: '', nickname: '', gender: '', birth: '',\n          idCheck: null, idMsg: '', nickCheck: null, nickMsg: ''\n        },\n        couple: { ...s.couple, open: true, partner: '', start: '', msg: '', ok: false, sent: false }\n      }), () => this.complete('login'));\n    }\n\n    const r = await this.apiPost('/login', { id: (a.name || '').trim(), password: a.password });\n    if (!r.ok) return fail(r.msg);\n    this.saveSession(r.user.id, r.token, a.remember);\n    this.setState(s => ({\n      user: { id: r.user.id, token: r.token }, me: { ...s.me, name: r.user.nickname, avatar: r.user.avatar || null }, points: r.user.points || 0,\n      partner: { ...s.partner, name: r.user.partnerNickname || s.partner.name, avatar: r.user.partnerAvatar || null },\n      start: r.user.startDate || s.start, coupleLinked: !!r.user.linked,\n      auth: { ...s.auth, open: false, msg: '', password: '' },\n      couple: { ...s.couple, open: !r.user.linked, partner: '', start: '', msg: '', ok: false, sent: false }\n    }), () => {\n      this.complete('login'); this.fetchMailbox(); this.fetchMemories(); this.fetchMessages(); this.fetchNotices();\n      this.fetchQuestStatus(); this.fetchOwnedItems(); this.fetchRegions();\n    });\n  }\n\n  async doFindPassword() { pImg = img;\n        this.setState(s => ({ crop: { ...s.crop, open: true, target, ratio: 'free' } }), () => this.initCropCanvas());\n      };\n      img.src = ev.target.result;\n    };\n    reader.readAsDataURL(file);\n  }\n  recropFormPhoto() {\n    const src = this.state.form.photo;\n    if (!src) return;\n    const img = new Image();\n    img.onload = () => {\n      this._cropImg = img;\n      this.setState(s => ({ crop: { ...s.crop, open: true, target: 'form', ratio: s.crop.ratio || 'free' } }), () => this.initCropCanvas());\n    };\n    img.src = src;\n  }\n  cropPoint(e, canvas) {\n    const r = canvas.getBoundingClientRect();\n    return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };\n  }\n  getCropRect(boxW, boxH) {\n    const ratio = this.state.crop.ratio;\n    let rw, rh;\n    if (ratio === '1:1') { rw = rh = Math.min(boxW, boxH) - 24; }\n    else if (ratio === '4:3') { rw = boxW - 24; rh = rw * 3 / 4; if (rh > boxH - 24) { rh = boxH - 24; rw = rh * 4 / 3; } }\n    else { rw = boxW - 24; rh = boxH - 24; }\n    return { rx: (boxW - rw) / 2, ry: (boxH - rh) / 2, rw, rh };\n  }\n  initCropCanvas() {\n    const canvas = document.getElementById('cwCropCanvas');\n    const img = this._cropImg;\n    if (!canvas || !img) return;\n    const boxW = canvas.width, boxH = canvas.height;\n    const ctx = canvas.getContext('2d');\n    const fitScale = Math.max(boxW / img.width, boxH / img.height);\n    this._cs = {\n      scale: fitScale, minScale: fitScale,\n      ox: (boxW - img.width * fitScale) / 2, oy: (boxH - img.height * fitScale) / 2,\n      dragging: false, lastX: 0, lastY: 0\n    };\n    const draw = () => {\n      ctx.clearRect(0, 0, boxW, boxH);\n      ctx.drawImage(img, this._cs.ox, this._cs.oy, img.width * this._cs.scale, img.height * this._cs.scale);\n      const { rx, ry, rw, rh } = this.getCropRect(boxW, boxH);\n      ctx.fillStyle = 'rgba(0,0,0,0.45)';\n      ctx.fillRect(0, 0, boxW, ry);\n
