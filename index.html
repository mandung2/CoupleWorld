<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Blog</title>
<style>
  :root {
    --bg: #fafaf9;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --accent: #2563eb;
    --card-bg: #ffffff;
    --border: #e5e5e5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    background: var(--card-bg);
  }

  header .logo {
    font-size: 1.3rem;
    font-weight: 700;
  }

  header nav a {
    margin-left: 1.5rem;
    text-decoration: none;
    color: var(--muted);
    font-size: 0.95rem;
  }

  header nav a:hover { color: var(--accent); }

  .hero {
    max-width: 720px;
    margin: 0 auto;
    padding: 5rem 1.5rem 4rem;
    text-align: center;
  }

  .hero h1 {
    font-size: 2.4rem;
    margin-bottom: 1rem;
  }

  .hero p {
    color: var(--muted);
    font-size: 1.1rem;
    margin-bottom: 2rem;
  }

  .hero .cta {
    display: inline-block;
    padding: 0.8rem 1.8rem;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
  }

  .posts {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.5rem 4rem;
  }

  .posts h2 {
    font-size: 1.4rem;
    margin-bottom: 1.5rem;
  }

  .post-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 1.5rem;
  }

  .post-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.5rem;
  }

  .post-card .date {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .post-card h3 {
    font-size: 1.1rem;
    margin-bottom: 0.6rem;
  }

  .post-card p {
    color: var(--muted);
    font-size: 0.95rem;
  }

  footer {
    text-align: center;
    padding: 2rem;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<header>
  <div class="logo">My Blog</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
</header>

<section class="hero">
  <h1>생각을 기록하는 공간</h1>
  <p>일상, 개발, 그리고 배운 것들을 편하게 적어두는 블로그입니다.</p>
  <a href="#posts" class="cta">글 둘러보기</a>
</section>

<section class="posts" id="posts">
  <h2>최근 글</h2>
  <div class="post-grid">
    <div class="post-card">
      <div class="date">2026.08.14</div>
      <h3>첫 번째 글</h3>
      <p>블로그를 시작하며 남기는 첫 인사입니다.</p>
    </div>
    <div class="post-card">
      <div class="date">2026.08.10</div>
      <h3>두 번째 글</h3>
      <p>요즘 관심있게 보고 있는 주제에 대한 이야기.</p>
    </div>
    <div class="post-card">
      <div class="date">2026.08.05</div>
      <h3>세 번째 글</h3>
      <p>간단한 팁과 정리 노트.</p>
    </div>
  </div>
</section>

<footer>
  © 2026 My Blog. All rights reserved.
</footer>

</body>
</html>
